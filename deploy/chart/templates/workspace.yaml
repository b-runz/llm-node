apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: workspace }
  template:
    metadata:
      labels: { app: workspace }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: {{ .Values.pullSecretName }}
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: OPENCODE_CONFIG_CONTENT
              value: '{"model":"{{ .Values.defaultModel }}","mcp":{"anyfetch":{"type":"local","command":["anyfetch","mcp"],"enabled":true}}}'
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: LLM_API_KEY }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/dev
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: workspace-home
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-home
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: workspace
spec:
  selector: { app: workspace }
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.host | quote }}]   # default Traefik certificate
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workspace
                port: { number: {{ .Values.port }} }
